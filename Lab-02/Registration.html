<!DOCTYPE html>
 <html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> Registration </title>
    </head>
    <body>  
        <h1> Registration </h1>
        <form>
            <label for="name"> Name: </label>
            <input type="text" id="name" name="name" required> <br><br>

            <label for="registration"> Registration: </label>
            <input type="text" id="registration" name="registration" required> <br><br>

            <label for="email"> Email: </label>
            <input type="email" id="email" name="email" required> <br><br>

            <label for="password"> Password: </label>
            <input type="password" id="password" name="password" required> <br><br>

            <label for="course"> Course: </label> <br>
            <select name="course" id="course" required>
                <option value=""> Select Course </option>
                <option value="web"> Web Technologies </option>
                <option value="data-science"> Introduction to Data Science </option>
                <option value="operating-systems"> Operating Systems </option>
                <option value="artificial-intelligence"> Artificial Intelligence </option>
            </select> <br><br>

            <label for="Semester"> Semester: </label> <br>
            <input type="radio" id="semester1" name="semester" value="1" required>
            <label for="semester1"> Semester 1 </label> <br>
            <input type="radio" id="semester2" name="semester" value="2" required>
            <label for="semester2"> Semester 2 </label> <br>
            <input type="radio" id="semester3" name="semester" value="3" required>  
            <label for="semester3"> Semester 3 </label> <br>
            <input type="radio" id="semester4" name="semester" value="4" required>
            <label for="semester4"> Semester 4 </label> <br>
            <input type="radio" id="semester5" name="semester" value="5" required>
            <label for="semester5"> Semester 5 </label> <br>
            <input type="radio" id="semester6" name="semester" value="6" required>  
            <label for="semester6"> Semester 6 </label> <br>
            <input type="radio" id="semester7" name="semester" value="7" required>
            <label for="semester7"> Semester 7 </label> <br>
            <input type="radio" id="semester8" name="semester" value="8" required>
            <label for="semester8"> Semester 8 </label> <br>

            <p> <h1> Terms and Conditions </h1> <br> I hereby agree to the terms and conditions. </p>
            <input type="checkbox" required> I Agree to the Terms and Conditions. <br><br>

            <button type="submit"> Register </button>
        </form>
    </body>
 </html>
