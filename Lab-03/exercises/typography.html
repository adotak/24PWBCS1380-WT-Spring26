<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typography</title>
    <link rel="stylesheet" href="../styles/typography.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Tangerine">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inconsolata">
</head>
<body>
    <div class="header">
        <h1>Typography</h1>
    </div>

    <div class="FontSizes">
        <p id="ten">10px</p>
        <p id="twenty">20px</p>
        <p id="thirty">30px</p>
        <p id="forty">40px</p>
        <p id="fifty">50px</p>
    </div>

    <div class="TextAlignment">
        <p id="left">Left Aligned</p>
        <p id="center">Center Aligned</p>
        <p id="right">Right Aligned</p>
    </div>

    <div class="TextDecoration">
        <p id="underline">Underline</p>
        <p id="overline">Overline</p>
        <p id="line-through">Line Through</p>
    </div>

    <div class="TextTransform">
        <p id="uppercase">Uppercase</p>
        <p id="lowercase">Lowercase</p>
        <p id="capitalize">Capitalize</p>
    </div>

    <div class="Shadow">
        <p id="text-shadow">Text Shadow</p>
    </div>
</body>
</html>
