<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Styling</title>
    <link rel="stylesheet" href="../styles/components.css">
</head>
<body>
    <nav>
        <h2>Navigation</h2>

            <li><a href="../Index.html">Back to Lab 03 Index</a></li>
            <li><a href="../../Index.html">Home</a></li>

    <hr>

    <h1>Button Styling Collection</h1>

    <h2>Sizes</h2>
    <button class="btn-small">Small</button>
    <button class="btn-medium">Medium</button>
    <button class="btn-large">Large</button>

    <h2>Colors</h2>
    <button class="btn-primary">Primary</button>
    <button class="btn-secondary">Secondary</button>
    <button class="btn-danger">Danger</button>

    <h2>Shapes</h2>
    <button class="btn-rounded">Rounded</button>
    <button class="btn-pill">Pill</button>
    <button class="btn-square">Square</button>

    <h2>Effects</h2>
    <button class="btn-shadow">Shadow</button>
    <button class="btn-gradient">Gradient</button>

    <h2>Disabled</h2>
    <button disabled>Disabled Button</button>
</body>
</html>
